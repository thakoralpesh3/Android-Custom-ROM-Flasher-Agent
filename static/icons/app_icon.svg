<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="green-android" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="16 12" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />

  <!-- Smartphone Silhouette -->
  <rect x="166" y="90" width="180" height="332" rx="36" fill="#1e293b" stroke="#38bdf8" stroke-width="6" filter="url(#glow)" />
  <!-- Screen Area -->
  <rect x="180" y="125" width="152" height="255" rx="16" fill="#0b0f19" />

  <!-- Android Head in Center of Screen -->
  <path d="M216 200 A 40 40 0 0 1 296 200 Z" fill="url(#green-android)" />
  <!-- Android Antennas -->
  <line x1="228" y1="172" x2="216" y2="152" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  <line x1="284" y1="172" x2="296" y2="152" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  <!-- Android Eyes -->
  <circle cx="236" cy="190" r="4" fill="#0f172a" />
  <circle cx="276" cy="190" r="4" fill="#0f172a" />

  <!-- Flashing Lightning Bolt / ROM Core Symbol -->
  <polygon points="266,215 236,270 258,270 246,315 284,255 260,255" fill="#facc15" filter="url(#glow)" />

  <!-- Bottom Phone Speaker / Home Pill -->
  <rect x="236" y="395" width="40" height="6" rx="3" fill="#64748b" />

  <!-- Upward Sync / Git Arrow -->
  <g transform="translate(370, 360)">
    <circle cx="20" cy="20" r="35" fill="#0284c7" />
    <path d="M12 25 L20 15 L28 25 M20 16 L20 32" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
